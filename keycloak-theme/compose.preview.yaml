# Local sandbox only. Production keeps its existing database, environment and command.
services:
  keycloak-theme-preview:
    image: spotifi-keycloak:theme-preview
    build:
      context: .
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:?Set KEYCLOAK_VERSION to the exact deployed Keycloak tag}
    command: ["start-dev", "--import-realm", "--spi-theme--static-max-age=-1", "--spi-theme--cache-themes=false", "--spi-theme--cache-templates=false"]
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./preview/realm.json:/opt/keycloak/data/import/spotifi-theme-preview-realm.json:ro
