# Apply through a Render Blueprint. Existing manually created sites must add
# the same rewrite in Dashboard > Redirects/Rewrites; a code deploy alone
# does not apply this file's hosting configuration.
services:
  - type: web
    name: spotifi-music-for-life
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_KEYCLOAK_URL
        sync: false
      - key: VITE_KEYCLOAK_REALM
        sync: false
      - key: VITE_KEYCLOAK_WEB_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
