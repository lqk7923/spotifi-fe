<!doctype html>
<html lang="en" class="login-pf">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Spotifi — Login design preview</title>
  <link rel="icon" href="../themes/spotifi/login/resources/img/favicon.svg">
  <link rel="stylesheet" href="../themes/spotifi/login/resources/css/spotifi.css">
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
  <script src="../themes/spotifi/login/resources/js/register-steps.js" defer></script>
</head>
<body data-page-id="login-login">
  <main class="login-pf-page">
    <div id="kc-header"><div id="kc-header-wrapper">Spotifi</div></div>
    <div class="card-pf">
      <header class="login-pf-header"><h1 id="kc-page-title">Log in to Spotifi</h1></header>
      <div id="kc-content"><div id="kc-content-wrapper">
        <form id="kc-form-login" data-preview-form>
          <div class="form-group">
            <label for="username">Email or username</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Email or username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pf-c-input-group">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
              <button type="button" aria-label="Show password" aria-controls="password" data-preview-password-toggle>
                <svg class="preview-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group login-pf-settings">
            <a href="#reset-password" data-preview-reset-password>Forgot your password?</a>
          </div>
          <div id="kc-form-buttons"><input id="kc-login" class="pf-c-button pf-m-primary" type="submit" value="Continue"></div>
          <output class="preview-output" aria-live="polite"></output>
        </form>
        <div id="kc-social-providers" class="kc-social-section kc-social-gray">
          <hr>
          <h2>Sign in with</h2>
          <ul class="pf-c-login__main-footer-links kc-social-links">
            <li><a id="social-google" class="pf-c-button pf-m-control pf-m-block kc-social-item kc-social-gray" href="#google-login" data-preview-google-login>
              <i class="kc-social-provider-logo fa fa-google" aria-hidden="true"></i>
              <span class="kc-social-provider-name kc-social-icon-text">Google</span>
            </a></li>
          </ul>
        </div>
        <div id="kc-info"><div id="kc-info-wrapper"><div id="kc-registration">Don't have an account? <a href="register.html">Sign up</a></div></div></div>
      </div></div>
    </div>
    <p class="spotifi-footer">This site is protected by D. and David Martinez<br>Please don't hack it.</p>
  </main>
</body>
</html>
